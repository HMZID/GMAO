# Déploiement en production sur Vercel, après approbation humaine.
#
# Déclenchement : fin de la CI sur `main` (merge de `develop` vers `main`), uniquement si la CI a réussi.
# Étapes, chacune bloquante pour la suivante :
#   1. contrôles avant approbation : configuration Vercel de production (noms des variables, jamais les
#      valeurs ; scripts/ci/production-env.sh) ;
#   2. approbation : l'environnement GitHub « production-approval » attend un approbateur désigné
#      (Actions → le workflow → « Review deployments » → Approve) ;
#   3. sauvegarde de la base : branche Neon instantanée avant toute migration (scripts/ci/neon-backup.sh) ;
#   4. déploiement avec la CLI Vercel ; la construction a lieu chez Vercel, avec les variables du projet,
#      migrations comprises (script `vercel-build`) ;
#   5. vérifications : sonde de santé et version, page de connexion, en-têtes de sécurité, tâche planifiée
#      protégée, API fermée sans session, anciennes adresses redirigées.
# Retour arrière : workflow « Retour arrière production » ; procédure complète : docs/exploitation-production.md.
#
# Configuration du dépôt (Settings) :
# - secret VERCEL_TOKEN, variables VERCEL_ORG_ID et VERCEL_PROJECT_ID ;
# - secret NEON_API_KEY et variable NEON_PROJECT_ID (sauvegarde) ;
# - variable PRODUCTION_URL facultative (adresse publique, par défaut https://gmao-eight-alpha.vercel.app) ;
# - environnement « production-approval » avec les approbateurs requis.
# Le déploiement automatique de `main` par Vercel est désactivé (vercel.json) : seul ce workflow met en production.
name: Déploiement production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Redéploiement manuel de `main` (même approbation requise).
  workflow_dispatch:

# Un seul déploiement à la fois ; un déploiement en attente d'approbation n'est pas annulé par le suivant.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://gmao-eight-alpha.vercel.app' }}

jobs:
  preflight:
    name: Contrôles avant approbation
    # CI réussie sur un push vers main (merge), ou lancement manuel depuis main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Réglages du dépôt
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing secret:VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing variable:VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing variable:VERCEL_PROJECT_ID"
          [ -n "$NEON_API_KEY" ] || missing="$missing secret:NEON_API_KEY"
          [ -n "$NEON_PROJECT_ID" ] || missing="$missing variable:NEON_PROJECT_ID"
          if [ -n "$missing" ]; then echo "::error::Configuration manquante dans les réglages du dépôt :$missing"; exit 1; fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Variables de production (Vercel)
        run: bash scripts/ci/production-env.sh

  deploy:
    name: Déployer sur Vercel (production)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-approval
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Exactement la version validée par la CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Une ancienne exécution relancée (« Re-run ») remettrait en ligne une version dépassée : on ne déploie
      # que le dernier commit de main. Pour redéployer main : Actions → Déploiement production → Run workflow.
      - name: Version à jour
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          current=$(git rev-parse HEAD)
          if [ "$current" != "$latest" ]; then
            echo "::error::Version dépassée : ${current:0:7} n'est plus le dernier commit de main (${latest:0:7}). Déployer depuis la dernière exécution, ou par « Run workflow »."
            exit 1
          fi
          echo "APP_VERSION=${current:0:7}" >> "$GITHUB_ENV"

      # Point de restauration de la base, pris avant les migrations du déploiement.
      - name: Sauvegarde de la base (Neon)
        id: backup
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: bash scripts/ci/neon-backup.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: CLI Vercel
        run: npm install --global vercel@59.26.0

      - name: Déploiement
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --env APP_VERSION="$APP_VERSION")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Déployé : $url, version $APP_VERSION (adresse de production : $PRODUCTION_URL)"

      # L'adresse de production doit répondre « ok » avec la version qui vient d'être déployée.
      - name: Vérification (sonde de santé et version)
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS "$PRODUCTION_URL/api/health" || true)
            case "$body" in *'"status":"ok"'*'"version":"'"$APP_VERSION"'"'*'"environment":"production"'*) echo "$body"; exit 0;; esac
            sleep 15
          done
          echo "::error::$PRODUCTION_URL/api/health ne répond pas « ok » en version $APP_VERSION (environnement production) : $body"
          exit 1

      # Parcours de base après mise en ligne ; en cas d'échec : « Retour arrière production ».
      - name: Vérifications après mise en ligne
        run: bash scripts/ci/smoke-test.sh "$PRODUCTION_URL"

      - name: Résumé
        if: always()
        env:
          BACKUP: ${{ steps.backup.outputs.backup }}
        run: |
          {
            echo "### Mise en production"
            echo "- Version : \`${APP_VERSION:-?}\`"
            echo "- Sauvegarde de la base avant déploiement : \`${BACKUP:-aucune}\`"
            echo "- Adresse : $PRODUCTION_URL"
            echo "- En cas de problème : Actions → « Retour arrière production » (docs/exploitation-production.md)."
          } >> "$GITHUB_STEP_SUMMARY"
