# Pipeline de l'environnement de développement (recette) : branche `develop` → Vercel (prévisualisation).
#
# Déclenchement : chaque push vers `develop` (fusion d'une branche GMAO-NN), automatiquement. Un déclencheur
# `push` prend le workflow de la branche poussée : le pipeline fonctionne sans attendre son arrivée sur main.
# Étapes, chacune bloquante pour la suivante :
#   1. vérifications et tests : la CI complète (ci.yml, réutilisée) ;
#   2. configuration Vercel : base et secrets distincts de la production, variables de portée Preview présentes,
#      créées depuis Neon si elles manquent (scripts/ci/preview-env.sh ; aucune valeur affichée) ;
#   3. déploiement : prévisualisation Vercel (VERCEL_ENV=preview), construite avec les variables Preview ;
#      `scripts/predeploy.ts` refuse en plus toute base marquée « production » ou existante non marquée ;
#      adresse fixe (DEVELOP_ALIAS, par défaut gmao-develop.vercel.app), puis sonde de santé.
# Pas d'approbation : c'est l'environnement de recette, avant la PR develop → main.
# Redéployer : Actions → Pipeline développement → dernière exécution → Re-run all jobs.
#
# Réglages GitHub : mêmes VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID que la production ; pour créer
# automatiquement les variables Vercel de la recette : secret NEON_API_KEY, variable NEON_PROJECT_ID, secret
# DEVELOP_PLATFORM_ADMIN_EMAILS ; facultatifs : DEVELOP_ALIAS, NEON_DEV_BRANCH, NEON_DEV_DATABASE, secret
# VERCEL_AUTOMATION_BYPASS_SECRET si la protection Vercel des prévisualisations est active.
# Détails : docs/deploiement-vercel.md.
name: Pipeline développement

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Seul le dernier état de develop compte : une exécution en cours est remplacée par la suivante.
concurrency:
  group: pipeline-develop
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  DEVELOP_ALIAS: ${{ vars.DEVELOP_ALIAS || 'gmao-develop.vercel.app' }}

jobs:
  checks:
    name: Vérifications et tests
    uses: ./.github/workflows/ci.yml

  vercel-config:
    name: Configuration Vercel (Preview)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Réglages du dépôt
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing secret:VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing variable:VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing variable:VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then echo "::error::Configuration manquante dans les réglages du dépôt :$missing"; exit 1; fi

      - uses: actions/checkout@v7

      # Noms et portées des variables Vercel (jamais les valeurs) ; variables Preview manquantes créées depuis
      # Neon si NEON_API_KEY est déclaré (scripts/ci/preview-env.sh). Aucune valeur n'est affichée.
      - name: Variables de l'environnement de développement
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_DEV_BRANCH: ${{ vars.NEON_DEV_BRANCH || 'develop' }}
          NEON_DEV_DATABASE: ${{ vars.NEON_DEV_DATABASE || 'gmao_dev' }}
          DEVELOP_PLATFORM_ADMIN_EMAILS: ${{ secrets.DEVELOP_PLATFORM_ADMIN_EMAILS }}
        run: bash scripts/ci/preview-env.sh

  deploy:
    name: Déployer sur Vercel (développement)
    needs: [checks, vercel-config]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development
      url: https://${{ vars.DEVELOP_ALIAS || 'gmao-develop.vercel.app' }}
    env:
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7

      # Une ancienne exécution relancée ne remet pas en ligne une version dépassée de develop.
      - name: Version à jour
        run: |
          latest=$(git ls-remote origin refs/heads/develop | cut -f1)
          current=$(git rev-parse HEAD)
          if [ "$current" != "$latest" ]; then
            echo "::error::Version dépassée : ${current:0:7} n'est plus le dernier commit de develop (${latest:0:7})."
            exit 1
          fi
          echo "APP_VERSION=${current:0:7}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: CLI Vercel
        run: npm install --global vercel@59.26.0

      # Sans --prod : prévisualisation, variables de portée Preview (base de développement).
      - name: Déploiement
        run: |
          url=$(vercel deploy --yes --token="$VERCEL_TOKEN" --env APP_VERSION="$APP_VERSION")
          vercel alias set "$url" "$DEVELOP_ALIAS" --token="$VERCEL_TOKEN"
          echo "Déployé : $url, version $APP_VERSION, adresse fixe https://$DEVELOP_ALIAS"

      - name: Vérification (sonde de santé, version et environnement)
        run: |
          header=()
          [ -n "$BYPASS" ] && header=(-H "x-vercel-protection-bypass: $BYPASS")
          for i in $(seq 1 20); do
            code=$(curl -sS -o health.json -w "%{http_code}" "${header[@]}" "https://$DEVELOP_ALIAS/api/health" || true)
            body=$(cat health.json 2>/dev/null || true)
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::error::Protection des prévisualisations Vercel active (HTTP $code) : la désactiver (Settings → Deployment Protection) ou déclarer le secret VERCEL_AUTOMATION_BYPASS_SECRET."
              exit 1
            fi
            case "$body" in *'"status":"ok"'*'"version":"'"$APP_VERSION"'"'*'"environment":"development"'*) echo "$body"; exit 0;; esac
            sleep 15
          done
          echo "::error::https://$DEVELOP_ALIAS/api/health ne répond pas « ok » en version $APP_VERSION (environnement development) : $body"
          exit 1
