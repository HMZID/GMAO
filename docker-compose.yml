# Base de développement : PostgreSQL 16 (identifiants alignés sur .env.example)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gmao
      POSTGRES_PASSWORD: gmao
      POSTGRES_DB: gmao
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - gmao-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmao -d gmao"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stockage S3 de développement (EQP-07), facultatif : docker compose --profile s3 up -d
  # SeaweedFS (Apache 2.0) ; le serveur MinIO open source n'est plus maintenu.
  s3:
    image: chrislusf/seaweedfs:4.48
    profiles: ["s3"]
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - gmao-s3:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  gmao-data:
  gmao-s3:
